; ---------------------------------------------------------------------------------------------------
; Engine-level RPC DoS detection (defense-in-depth for this direct-IP / listen-server P2P game).
; The active protection is the per-controller RPC throttle in C++ (ABHPlayerController::
; AllowLobbyActionRpc and the per-station answer cooldowns). The engine feature below is left as a
; correctly-structured template but DISABLED, because its thresholds must be load-tested against real
; matches first — too-aggressive values will kick legitimate players (a worse connectivity bug). To
; enable: set bRPCDoSDetection=true and tune the severity sections, then verify under real load.
;
; Mechanism (UE 5.7): URPCDoSDetectionConfig is PerObjectConfig; the driver reads section
; "[GameNetDriver RPCDoSDetection]" and each severity name maps to "[RPCDoSDetection.<Name>]".
;
; [GameNetDriver RPCDoSDetection]
; bRPCDoSDetection=true
; bRPCDoSAnalytics=true
; HitchTimeQuotaMS=300
; HitchSuspendDetectionTimeMS=180
; InitialConnectToleranceMS=400
; +DetectionSeverity=Normal
; +DetectionSeverity=Spike
; +DetectionSeverity=DoS
;
; [RPCDoSDetection.Normal]
; EscalateQuotaRPCsPerFrame=50
; EscalateQuotaRPCsPerPeriod=300
; EscalateTimeQuotaMSPerFrame=20
; EscalateTimeQuotaMSPerPeriod=100
; EscalateQuotaTimePeriod=8
;
; [RPCDoSDetection.Spike]
; EscalateQuotaRPCsPerFrame=100
; EscalateQuotaRPCsPerPeriod=600
; EscalateTimeQuotaMSPerFrame=40
; EscalateTimeQuotaMSPerPeriod=200
; EscalateQuotaTimePeriod=8
; CooloffTime=10
;
; [RPCDoSDetection.DoS]
; EscalateQuotaRPCsPerFrame=150
; EscalateQuotaRPCsPerPeriod=900
; EscalateTimeQuotaMSPerFrame=60
; EscalateTimeQuotaMSPerPeriod=300
; EscalateQuotaTimePeriod=8
; bLogEscalate=true
; bKickPlayer=true
; ---------------------------------------------------------------------------------------------------

