+DirectoriesToAlwaysCook=(Path="/Game/SecurityCameras/Sounds")
+DirectoriesToAlwaysCook=(Path="/Game/SoundsOfHorror/Impacts/CUE")
+DirectoriesToAlwaysCook=(Path="/Game/SoundsOfHorror/Rumbles/CUE")
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/Characters/Hider")
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/Characters/Hunter")
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/Downloaded")
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/SCP096")
; NOTE: Art/Jumpscares/Whisper is deliberately NOT NeverCook'd. Whisper-scare variants are discovered from
; that folder at runtime (BHJumpscareVariantLibrary), so listing it here would strip the art from packages
; while everything still works in-editor — the scares would just silently never fire in cooked builds.
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/Jumpscares/FreeCustomizableJumpscares/Input")
+DirectoriesToNeverCook=(Path="/Game/BlackoutHunt/Art/Jumpscares/FreeCustomizableJumpscares/Blueprints/FirstPerson")
+DirectoriesToNeverCook=(Path="/Game/Free_Jumpscares")
; SmartBasicInterfaces is always-cooked as a whole for its runtime Meshes/Materials/Sound (used by the
; breaker/objective/station props). The runtime meshes and blueprints (SM_light, SM_alarm,
; SM_simpledoorglass, BP_LightSwitch, BP_CardReader, ...) pull sounds and materials out of the pack's
; Demo/ subtree (Demo/Sounds, Demo/SCContent/Materials), so Demo/ must stay cookable; marking it
; NeverCook orphans those dependencies and fails the cook with "Content is missing from cook".
+DirectoriesToAlwaysStageAsNonUFS=(Path="BlackoutHunt/Art/UI")

