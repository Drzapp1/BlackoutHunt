; Use the baked /Game/BlackoutHunt/Maps/<Level> .umap (placed actors loaded identically on server and
; client) instead of the runtime procedural generator. This is the accurate, hand-finishable level path
; and it sidesteps the ABHStaticBlockField spec-array replication (a ~152 KB property that exceeds the
; 64 KB net bunch cap and fails to replicate on every client join). Facility/Substation/Foggrounds/Tutorial
; are baked under Content/BlackoutHunt/Maps; the resolver falls back to /Engine/Maps/Entry only if a map is
; missing. (See Docs/PREFLIGHT_HARDENING_FINDINGS.md section J.)
bUseAuthoredLevels=True
ReconnectGraceSeconds=120.0
bClassroomMode=True
bAllowStudentTeacherAdminControls=False
bAllowTunnelHelper=True
bAllowHotspotHelper=False
; When True the host binds 127.0.0.1 only and students MUST use the Playit tunnel (no LAN).
; When False (default) the host binds all interfaces: Playit tunnel AND direct-LAN both work.
; LAN is useful when everyone connects to the same personal hotspot (phone or laptop hotspot) --
; school-network client isolation is bypassed and Windows Firewall on that private hotspot network
; is typically approvable by a standard user (no domain admin required). On the school's managed
; network, if the firewall prompt is blocked, Playit tunnel is the automatic fallback anyway.
; Set True only to force tunnel-only (e.g. IT policy blocks inbound UDP on every network).
bClassroomLoopbackOnlyHost=False
