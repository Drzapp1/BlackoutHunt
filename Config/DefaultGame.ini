; Imported CC0 Kenney Space Kit roof props (telescope dish, antenna, rocks, meteor, stool). Referenced only by
; TSoftObjectPtr/LoadObject in ABHGameMode::BuildTrainRoofExtras with procedural fallbacks, so the cooker would
; otherwise drop them and the packaged build would show only the fallbacks. CC0 1.0 (see Docs/ASSETS.md).
+DirectoriesToAlwaysCook=(Path="/Game/BlackoutHunt/Art/Roof")
+DirectoriesToAlwaysCook=(Path="/Game/BlackoutHunt/Data")
; Cook the project-owned hunter-AI StateTree (ST_BH_HunterAtmosphere). It is referenced only by a
; TSoftObjectPtr in the UBHGameSettings CDO (HunterStateTreeAsset, below) and no .umap hard-references it,
; so without this entry the cooker drops it and a build with bUseStateTreeAI=True silently falls back to the
; C++ bot policy in the packaged classroom build (it works in-editor only). Project-owned asset, no licensing concern.
+DirectoriesToAlwaysCook=(Path="/Game/BlackoutHunt/AI")
+DirectoriesToAlwaysCook=(Path="/Game/BlackoutHunt/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/SmartBasicInterfaces")
+DirectoriesToAlwaysCook=(Path="/Game/A_Surface_Footstep/Niagara_FX")
