; O is bound directly in code (ABHPlayerController::HandleResetKey) as a single context-aware reset key:
; on a train level it resets you to the centre of the carriage you're in (works wedged inside OR out on the
; roof); otherwise it's the lobby tree climb-down or the live-level reset-to-spawn. The old "ResetToTrain"
; action mapping was removed so it can never re-shadow that bind (it previously fought the tree-egg keybind on O).
+ActionMappings=(ActionName="ForceStartRound",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=F10)
